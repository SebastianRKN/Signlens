[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signlens"
version = "0.1.0"
description = "Experimental static-letter recognition and two-hand text composition"
requires-python = ">=3.12,<3.13"
dependencies = ["mediapipe==1.1.0", "opencv-python==5.0.0.93", "numpy==2.5.3", "pyyaml==6.0.3", "scikit-learn==1.9.1", "joblib==1.6.0", "matplotlib==3.11.2"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "joblib>=1.3", "matplotlib>=3.8"]
dev = ["pytest>=8", "scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
signlens = "signlens.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
