[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signlens"
version = "0.1.0"
description = "Real-time hand & arm tracking pipeline - foundation for sign language translation"
requires-python = ">=3.10"
dependencies = ["mediapipe>=0.10.14", "opencv-python>=4.9", "numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "joblib>=1.3", "matplotlib>=3.8"]
dev = ["pytest>=8", "scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
signlens = "signlens.app:main"

[tool.setuptools.packages.find]
where = ["src"]
